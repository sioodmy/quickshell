[package]
name = "backendqs"
version = "0.1.0"
edition = "2021"

[build]
rustflags = ["-C", "target-cpu=native"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json"] }
notify = "8.2.0"
regex = "1.12.4"
chrono = "0.4.45"
urlencoding = "2.1.3"

lofty = "0.24.0"
walkdir = "2.5.0"
image = "0.25.10"
sha2 = "0.11.0"
rodio = { git = "https://github.com/RustAudio/rodio", rev = "c5f1e94290922fe4ee963ce6f85754ea6ba36243", features = ["symphonia-libopus"] }
zbus = { version = "5", features = ["tokio"] }
ignore = "0.4.28"
nucleo-matcher = "0.3.1"
rayon = "1.12.0"
syntect = "5.2.0"

# Archive listing (central directory / headers only — no extract)
zip = { version = "2.4", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.5"
xz2 = "0.1"
zstd = "0.13"
lz4_flex = "0.11"
sevenz-rust2 = { version = "0.21", default-features = false, features = ["util"] }

axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
qrcode = "0.14"
uuid = { version = "1", features = ["v4"] }
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls", "http-api-client"] }
rink-core = { version = "0.9.0", features = ["bundle-files"] }
notify-rust = "4.18.0"
wl-clipboard-rs = "0.9.3"
open = "5.4.0"
wayland-client = "0.31.2"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
lazy_static = "1.5.0"
orgize = "0.9.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
mathtosvg = { git = "https://github.com/sioodmy/mathtosvg", version = "0.1.0" }
zbus-polkit-agent = "0.4.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
